# Eval gate: runs the gateway against a real open-source model (Llama 3.2 1B via Ollama)
# and fails the build if the pass rate drops below evals/cases.json "minPassRate".
name: model-eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        run: npm test

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull the model
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          ollama pull llama3.2:1b

      - name: Start the gateway
        env:
          GATEWAY_KEYS: ci-key
          RATE_LIMIT_PER_MIN: "1000"
          REQUEST_TIMEOUT_MS: "180000"
        run: |
          nohup node src/server.js > gateway.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done

      - name: Run evals
        env:
          GATEWAY_URL: http://localhost:8080
          GATEWAY_KEY: ci-key
        run: node evals/run.js

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- gateway log"; cat gateway.log || true
          echo "--- ollama log"; tail -n 50 ollama.log || true
